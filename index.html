const ER=18,OTOL=36;/* 消しゴム半径(画面px) / 画線をつなぐ許容(画面px) */

function oJoin(S_,tol){const C=S_.filter(q=>q.length>1).map(q=>q.slice());

   外壁・寸法より下の層に描画(トレース用)。図面枠の内側にクリップされ、PDF出力にも反映。DXFには含まれない。 ---- */
const IMGC=new Map();
function getImg(src){let e=IMGC.get(src);if(!e){e=new Image();e.onload=()=>render();e.src=src;IMGC.set(src,e)}return e.complete&&e.naturalWidth?e:null}
function imgPass(c,V,S){const L=SHP().filter(s=>s.t=='img');if(!L.length)return;const q=meta.sc;c.save();c.beginPath();c.rect(V.ox+9.4*q*V.s,V.oy+9.4*q*V.s,401.2*q*V.s,259.2*q*V.s);c.clip();
 L.forEach(s=>{const im=getImg(s.src);if(!im)return;const cc=cen(s),[x,y]=S({x:cc.x,y:cc.y});c.save();c.translate(x,y);c.rotate(s.rot||0);c.drawImage(im,-cc.w*V.s,-cc.h*V.s,2*cc.w*V.s,2*cc.h*V.s);c.restore()});c.restore()}
function hitImg(p){const L=SHP();for(let i=L.length-1;i>=0;i--){const s=L[i];if(s.t!='img')continue;const c=cen(s),q=toL(s,p);if(Math.abs(q.x)<=c.w&&Math.abs(q.y)<=c.h)return s}return null}
/* 保存容量(localStorage)対策: 長辺1400pxに縮小してJPEG化 */
function shrinkPic(f){return new Promise((ok,ng)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{try{const w0=im.naturalWidth,h0=im.naturalHeight;if(!w0||!h0)throw 0;const k=Math.min(1,1400/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k)),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);ok({src:c.toDataURL('image/jpeg',.85),w,h})}catch(e){ng(e)}finally{URL.revokeObjectURL(u)}};
 im.onerror=()=>{URL.revokeObjectURL(u);ng(new Error('img'))};im.src=u})}
async function addPic(f){if(!f||!/^image\//.test(f.type||'')){alert('画像ファイルを選んでください');return}
 let r;try{r=await shrinkPic(f)}catch(e){alert('画像を読み込めませんでした');return}
 const q=meta.sc;let ww=100*q,hh=ww*r.h/r.w;if(hh>120*q){hh=120*q;ww=hh*r.w/r.h}
 let x=(cw/2-V.ox)/V.s,y=(ch/2-V.oy)/V.s;const lx=9*q+ww/2,hx=411*q-ww/2,ly=9*q+hh/2,hy=269*q-hh/2;
 x=lx<=hx?Math.max(lx,Math.min(hx,x)):210*q;y=ly<=hy?Math.max(ly,Math.min(hy,y)):139*q;
 save();const s={id:D.n++,t:'img',src:r.src,x1:x-ww/2,y1:y-hh/2,x2:x+ww/2,y2:y+hh/2,rot:0,text:'',size:250,bump:300};
 SHP().push(s);tool='sel';sel={o:s};ui();commit()}
